name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel an in-progress run —
# letting it finish keeps the live site consistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run verify script
        run: node scripts/verify.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    # Only deploy on push to the default branch, not on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root — it's already a static site.
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
