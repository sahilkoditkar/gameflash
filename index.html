<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c0f14" />
  <title>GameFlash &mdash; mini arcade</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23ffcc33'/><text x='8' y='12' font-family='monospace' font-size='10' text-anchor='middle' fill='%230c0f14'>G</text></svg>" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">G</span>
        <span class="title">GameFlash</span>
      </div>
      <nav class="topnav">
        <button data-action="home" type="button">Home</button>
        <button data-action="fullscreen" type="button">Fullscreen</button>
      </nav>
    </header>

    <main id="stage">
      <section id="launcher" class="launcher" aria-label="Game launcher">
        <h1>Pick a game</h1>
        <ul id="game-grid" class="game-grid"></ul>
      </section>

      <section id="game-host" class="game-host" hidden>
        <canvas id="game-canvas" tabindex="0" aria-label="Game viewport"></canvas>
        <div id="hud-layer" class="hud-layer" aria-live="polite"></div>
        <div id="overlay-layer" class="overlay-layer" hidden></div>
      </section>
    </main>

    <footer class="bottombar">
      <span id="status-text">Ready.</span>
      <span id="fps-text" aria-label="Frames per second">&mdash;</span>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
