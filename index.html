<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c0f14" />
  <title>GameFlash &mdash; mini arcade</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%2314b8a6'/><text x='8' y='12' font-family='monospace' font-size='10' text-anchor='middle' fill='%230c0f14'>G</text></svg>" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <section id="launcher" class="launcher" aria-label="Game launcher">
    <div class="launcher-inner">
      <header class="launcher-header">
        <span class="logo">G</span>
        <h1>GameFlash</h1>
      </header>
      <ul id="game-grid" class="game-grid"></ul>
      <p class="launcher-tip">Tip: connect a gamepad — it auto-binds. <kbd>Esc</kbd> returns here from any game.</p>
    </div>
  </section>

  <section id="game-host" class="game-host" hidden>
    <canvas id="game-canvas" tabindex="0" aria-label="Game viewport"></canvas>
    <div id="hud-layer" class="hud-layer" aria-live="polite"></div>
    <div id="overlay-layer" class="overlay-layer" hidden></div>

    <button id="menu-button" type="button" aria-label="Back to menu" title="Back to menu (Esc)">
      &larr; Menu
    </button>
  </section>

  <noscript>
    <div class="noscript">GameFlash needs JavaScript enabled to run.</div>
  </noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
